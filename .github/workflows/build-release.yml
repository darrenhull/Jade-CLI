name: Build, test and release native CLI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and test native C++ CLI
        run: ./scripts/build-native-cli.ps1
      - name: Test native workflow boundaries
        run: Get-ChildItem tests/WorkflowContract -Filter '*_tests.ps1' | ForEach-Object { & $_.FullName }
      - name: Test native distribution packaging
        run: Get-ChildItem tests/NativeDistribution -Filter '*_tests.ps1' | ForEach-Object { & $_.FullName }
      - name: Smoke test outside checkout without Node
        run: ./scripts/smoke-native-cli.ps1
      - name: Create native release assets
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/package-native-cli.ps1 -Tag $env:RELEASE_TAG
      - name: Retain tested distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: jade-cli-windows-${{ github.sha }}
          path: |
            dist/jade-cli-win-x64.zip
            dist/jade-cli.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
      - name: Record native test scope
        run: |
          @'
          ## Native Jade CLI verification
          - Native C++ contract, process, broker and packaging tests passed.
          - The portable executable worked outside the checkout without Node.
          - The distribution has no JavaScript engine, embedded Node or Python.
          - Hosted checks use committed owned helper executables; native connected Jade tests require the separately licensed runtime and a disposable database and are not claimed here.
          '@ >> $env:GITHUB_STEP_SUMMARY

  release-guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-ancestry.yml

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, release-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, Node 24
        with:
          name: jade-cli-windows-${{ github.sha }}
          path: release
      - name: Verify downloaded native assets
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish tested native GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SHA -notmatch '^[a-f0-9]{40}$') { throw 'A full approved commit SHA is required.' }
          $archive = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'release/jade-cli-win-x64.zip'))
          try {
            $entry = $archive.GetEntry('distribution.json')
            if (!$entry) { throw 'The native release manifest is missing.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          if ($manifest.runtime -ne 'native-cpp' -or $manifest.packageVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid native release identity.' }
          $tag = 'v' + $manifest.packageVersion
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Release tag does not match the native version.' }
          $existingJson = gh release view "$tag" --json isDraft,targetCommitish,url 2>$null
          $exists = $LASTEXITCODE -eq 0
          $existing = if ($exists) { $existingJson | ConvertFrom-Json } else { $null }
          if ($exists -and !$existing.isDraft) {
            . ./scripts/PublishedNativeRelease.ps1
            Test-PublishedNativeRelease -Tag $tag -ExpectedVersion $manifest.packageVersion
            "$tag is already published and remains unchanged. Bump the native version for a new release." >> $env:GITHUB_STEP_SUMMARY
            return
          }
          $tagCommit = git rev-parse --verify --quiet "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -eq 0 -and ([string]$tagCommit).Trim() -ne $env:GITHUB_SHA) { throw 'Existing tag points to a different commit.' }
          if ($LASTEXITCODE -notin @(0,1)) { throw 'Could not verify the native release tag.' }
          $assets = @('release/jade-cli-win-x64.zip','release/jade-cli.exe','release/SHA256SUMS')
          if ($exists) {
            if ($existing.targetCommitish -ne $env:GITHUB_SHA) { throw 'An existing draft belongs to another commit.' }
            gh release upload "$tag" @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not resume the matching unpublished draft.' }
            gh release edit "$tag" --draft=false --target "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish the matching native draft.' }
          } else {
            gh release create "$tag" @assets --draft --target "$env:GITHUB_SHA" --title "Jade CLI $tag" --generate-notes --notes "Download jade-cli-win-x64.zip and keep native helpers with jade-cli.exe. Native C++, no Node/Python runtime. Connected operations require an installed compatible licensed Jade runtime."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the native release.' }
            gh release edit "$tag" --draft=false --target "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish the uploaded native release.' }
          }
          "Published $tag from approved commit $env:GITHUB_SHA." >> $env:GITHUB_STEP_SUMMARY

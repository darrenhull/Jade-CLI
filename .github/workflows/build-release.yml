name: Build, test and release native CLI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and test native C++ CLI
        run: ./scripts/build-native-cli.ps1
      - name: Test verified native release updates
        run: Get-ChildItem tests/NativeReleaseUpdater -Filter '*_tests.ps1' | ForEach-Object { & $_.FullName }
      - name: Test native distribution packaging
        run: ./tests/NativeDistribution/NativeDistribution_package_tests.ps1
      - name: Smoke test outside checkout without Node
        run: ./scripts/smoke-native-cli.ps1
      - name: Create native release assets
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/package-native-cli.ps1 -Tag $env:RELEASE_TAG
      - name: Retain tested distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jade-cli-windows-${{ github.sha }}
          path: |
            dist/jade-cli-win-x64.zip
            dist/jade-cli.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
      - name: Record native test scope
        run: |
          @'
          ## Native Jade CLI verification
          - Native C++ contract, process, broker and packaging tests passed.
          - The portable executable worked outside the checkout without Node.
          - The distribution has no JavaScript engine, embedded Node or Python.
          - Hosted checks use committed owned helper executables; native connected Jade tests require the separately licensed runtime and a disposable database and are not claimed here.
          '@ >> $env:GITHUB_STEP_SUMMARY

  developer-tools:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
      - name: Test development-only MCP packaging and PR automation
        run: node --test build-tools/tests/*/*_tests.test.js tests/AgentPullRequest/*_tests.test.js tests/release-ancestry/*_tests.test.js

  open-agent-pr:
    if: github.event_name == 'push' && github.actor == 'darrenhull' && github.repository_owner == 'darrenhull' && startsWith(github.ref, 'refs/heads/codex/agent/')
    needs: [build, developer-tools]
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/open-agent-pr.yml

  release-guard:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/release-ancestry.yml

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [build, developer-tools, release-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jade-cli-windows-${{ github.sha }}
          path: release
      - name: Verify downloaded native assets
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish tested native GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release create "$RELEASE_TAG" release/jade-cli-win-x64.zip release/jade-cli.exe release/SHA256SUMS --verify-tag --title "Jade CLI $RELEASE_TAG" --generate-notes --notes "Download jade-cli-win-x64.zip and keep native helpers with jade-cli.exe. Native C++, no Node/Python runtime. Connected operations require an installed compatible licensed Jade runtime."
